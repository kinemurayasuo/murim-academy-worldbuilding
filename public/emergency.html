<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무림아카데미학원 세계관</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 900px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.3em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #FFD700;
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .category {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .category:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-5px);
        }
        
        .category-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .status {
            background: rgba(0,255,0,0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid rgba(0,255,0,0.3);
        }
        
        .loading {
            display: inline-block;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏮 무림아카데미학원</h1>
        <p class="subtitle">전통과 현대가 공존하는 무림 세계</p>
        
        <div class="status">
            <h2><span class="loading">✅</span> 배포 성공!</h2>
            <p>현재 시간: <span id="time"></span></p>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number">139</div>
                <div>설정 문서</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">6</div>
                <div>카테고리</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">2025</div>
                <div>배경 연도</div>
            </div>
        </div>
        
        <div class="categories">
            <div class="category">
                <div class="category-icon">🌍</div>
                <h3>세계관</h3>
                <p>현대 무림의 기본 설정</p>
            </div>
            <div class="category">
                <div class="category-icon">🏛️</div>
                <h3>세력</h3>
                <p>문파와 조직 정보</p>
            </div>
            <div class="category">
                <div class="category-icon">👥</div>
                <h3>인물</h3>
                <p>주요 캐릭터 설정</p>
            </div>
            <div class="category">
                <div class="category-icon">⚔️</div>
                <h3>스킬</h3>
                <p>무공과 기술 체계</p>
            </div>
            <div class="category">
                <div class="category-icon">⚙️</div>
                <h3>시스템</h3>
                <p>게임 메커니즘</p>
            </div>
            <div class="category">
                <div class="category-icon">📖</div>
                <h3>스토리</h3>
                <p>시나리오와 이벤트</p>
            </div>
        </div>
        
        <div style="margin-top: 30px;">
            <a href="#" class="btn" onclick="alert('React 앱이 준비되는 중입니다!')">📚 세계관 탐색하기</a>
            <a href="#" class="btn" onclick="showInfo()">ℹ️ 정보</a>
        </div>
    </div>
    
    <script>
        function updateTime() {
            document.getElementById('time').textContent = new Date().toLocaleString('ko-KR');
        }
        
        function showInfo() {
            alert('🏮 무림아카데미학원 세계관\n\n📅 2025년 대한민국\n📱 스마트폰과 무공이 공존하는 현대 무협\n🏫 특수 교육기관을 중심으로 한 이야기\n\n💻 React + TypeScript로 제작\n🌐 GitHub Pages로 배포');
        }
        
        // 카테고리 클릭 이벤트
        document.querySelectorAll('.category').forEach(category => {
            category.addEventListener('click', function() {
                const title = this.querySelector('h3').textContent;
                alert(`${title} 카테고리를 선택했습니다!\n\nReact 앱에서 자세한 내용을 확인할 수 있습니다.`);
            });
        });
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
