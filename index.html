    <body>
        <!-- NDH 바로가기: SPA/라우터 간섭 없이 정적 HTML로 이동 (dev/prod 모두에서 동작) -->

        <noscript>
          <div style="position:fixed;inset:16px;z-index:99999;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:16px;color:#111;font:14px/1.4 system-ui,Segoe UI,Roboto,Apple SD Gothic Neo,Pretendard,sans-serif">
            이 사이트를 보려면 JavaScript가 필요합니다.
          </div>
        </noscript>

        <div id="root"></div>

        <!-- 전역 에러/Promise 거부를 화면에 즉시 표시하는 최소 오버레이 (흰 화면 원인 추적) -->
        <script>
          (function(){
            function showOverlay(message, detail){
              try {
                var el = document.getElementById('app-error-overlay');
                if(!el){
                  el = document.createElement('div');
                  el.id = 'app-error-overlay';
                  el.style.position = 'fixed';
                  el.style.top = '12px';
                  el.style.right = '12px';
                  el.style.maxWidth = '720px';
                  el.style.zIndex = '2147483647';
                  el.style.background = 'rgba(255, 241, 242, 0.98)';
                  el.style.color = '#7f1d1d';
                  el.style.border = '1px solid #fecaca';
                  el.style.boxShadow = '0 10px 30px rgba(0,0,0,.15)';
                  el.style.borderRadius = '12px';
                  el.style.padding = '12px 14px';
                  el.style.font = '12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
                  el.style.whiteSpace = 'pre-wrap';
                  document.body.appendChild(el);
                }
                el.innerText = '[APP ERROR]\n' + message + (detail ? ('\n\n' + detail) : '');
              } catch(_){}
            }
            window.addEventListener('error', function(e){
              var m = (e && e.message) ? e.message : String(e);
              var d = (e && e.error && e.error.stack) ? e.error.stack : '';
              showOverlay(m, d);
            });
            window.addEventListener('unhandledrejection', function(e){
              var reason = e && e.reason ? e.reason : 'Unhandled promise rejection';
              var m = (reason && reason.message) ? reason.message : String(reason);
              var d = (reason && reason.stack) ? reason.stack : '';
              showOverlay(m, d);
            });
          })();
        </script>

    </body>
