<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages에서 SPA 라우팅을 위해 hash 기반으로 리다이렉트
      (function() {
        var path = window.location.pathname;
        var base = '/murim-academy-worldbuilding/';
        if (!path.startsWith(base)) return;
        var relative = path.substring(base.length);
        // 정적 파일(확장자 포함) 요청이면 SPA 리다이렉트 하지 않음
        if (relative && relative.includes('.')) return;
        var hash = '#/' + relative.replace(/^\/+/, '');
        window.location.replace(base + hash);
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
